# =============================================================================
#  nginx site for the Social Media BOT
#
#  Placeholders (@DOMAIN@ and friends) are substituted by
#  deploy/install_ubuntu.sh, which then runs certbot. Certbot rewrites this
#  file in place: it adds the TLS listener, the certificate paths and the
#  HTTP-to-HTTPS redirect. So this file is what the server looks like *before*
#  certificates - see the commented block at the bottom for the finished shape.
#
#  Install by hand:
#      sudo cp deploy/nginx-socialbot.conf /etc/nginx/sites-available/socialbot
#      sudo ln -s /etc/nginx/sites-available/socialbot /etc/nginx/sites-enabled/
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#      sudo certbot --nginx -d bot.example.com --redirect
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@;

    # Let's Encrypt writes its HTTP-01 challenge here. It must stay reachable
    # over plain HTTP even after the redirect is added, or renewal fails.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        allow all;
    }

    # ---------------------------------------------------------------------
    # Request limits
    # ---------------------------------------------------------------------
    # Video uploads are large; without this nginx returns 413 long before the
    # application ever sees the request. Keep it in step with MAX_UPLOAD_MB.
    client_max_body_size @MAX_UPLOAD_MB@M;
    # Stream the body straight through instead of spooling the whole file to
    # disk first - noticeably faster for a 500 MB upload.
    proxy_request_buffering off;

    # ---------------------------------------------------------------------
    # Security headers
    # ---------------------------------------------------------------------
    # The application sets these too; repeating them here means they survive
    # even if a request is served by nginx alone (an error page, say).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    # ---------------------------------------------------------------------
    # Static files, served by nginx rather than Python
    # ---------------------------------------------------------------------
    location /static/ {
        alias @INSTALL_DIR@/app/static/;
        expires 7d;
        access_log off;
    }

    # ---------------------------------------------------------------------
    # Everything else goes to gunicorn
    # ---------------------------------------------------------------------
    location / {
        proxy_pass http://@BIND_HOST@:@BIND_PORT@;

        # These four headers are what make ProxyFix work in the application:
        # without X-Forwarded-Proto the app would build http:// URLs and
        # redirect in a loop, and the audit log would record nginx's own IP.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # An upload plus its ffmpeg conversion happens inside one request, so
        # the read timeout has to be generous. Keep it >= gunicorn's --timeout.
        proxy_connect_timeout 60s;
        proxy_send_timeout    @TIMEOUT@s;
        proxy_read_timeout    @TIMEOUT@s;
    }

    # The health endpoint is polled by monitoring; keep it out of the log.
    location = /health {
        proxy_pass http://@BIND_HOST@:@BIND_PORT@/health;
        proxy_set_header Host $host;
        access_log off;
    }
}

# =============================================================================
#  What certbot turns the above into
# =============================================================================
#
#  server {
#      listen 80;
#      server_name bot.example.com;
#      # Everything except the ACME challenge is redirected to HTTPS.
#      return 301 https://$host$request_uri;
#  }
#
#  server {
#      listen 443 ssl http2;
#      listen [::]:443 ssl http2;
#      server_name bot.example.com;
#
#      ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
#      ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;
#      include /etc/letsencrypt/options-ssl-nginx.conf;
#      ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
#
#      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#
#      ... the location blocks from above ...
#  }
#
#  Renewal is handled by the certbot.timer systemd unit. Check it with:
#      systemctl list-timers certbot.timer
#      sudo certbot renew --dry-run
# =============================================================================
